<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Solicitud de Materiales</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =====================================================
     ENCABEZADO
===================================================== -->

<header class="encabezado-industrial">


    <!-- DECORACIÓN INDUSTRIAL -->

    <div class="decoracion-industrial">

        <span class="engranaje engranaje-1">⚙</span>

        <span class="engranaje engranaje-2">⚙</span>

        <span class="engranaje engranaje-3">⚙</span>

        <span class="linea-tecnica linea-1"></span>

        <span class="linea-tecnica linea-2"></span>

    </div>


    <!-- MARCA -->

    <div class="titulo-empresa">

        <div class="marca-industrial">

            <div class="simbolo-m">
                M
            </div>

            <div class="simbolo-n">
                I
            </div>

            <div class="simbolo-n">
                N
            </div>

            <div class="simbolo-c">

                C

                <span>⚙</span>

            </div>

        </div>


        <div class="texto-empresa">

            <div class="nombre-empresa">

                MANTENIMIENTO INDUSTRIAL COLOMBIA

            </div>


        </div>

    </div>


    <!-- TÍTULO DEL SISTEMA -->

    <div class="titulo-sistema">


        <div class="icono-sistema">

            ⚙

        </div>


        <div>

            <h1>
                Solicitud de Materiales
            </h1>


            <p>
                Catálogo de materiales 
            </p>

        </div>


    </div>


    <!-- BOTÓN DE LA SOLICITUD -->

    <button
        id="btnCanasta"
        class="btn-canasta"
    >

        🛒 Mi solicitud

        <span id="contadorCanasta">
            0
        </span>

    </button>


</header>



<!-- =====================================================
     CONTENIDO PRINCIPAL
===================================================== -->

<main>


    <!-- INFORMACIÓN -->

    <div class="note">

        <strong>
            Solicitud de materiales
        </strong>

        <br>

        Busca el material que necesitas y agrégalo a tu solicitud.

    </div>


    <!-- BUSCADOR -->

    <input
        id="buscador"
        class="search"
        type="search"
        placeholder="🔎 Buscar material..."
        autocomplete="off"
    >


    <!-- CONTADOR -->

    <div
        id="contador"
        class="count"
    ></div>


    <!-- LISTA DE MATERIALES -->

    <section id="lista"></section>


</main>



<!-- =====================================================
     VENTANA EMERGENTE DE LA SOLICITUD
===================================================== -->

<div
    id="modalCanasta"
    class="modal"
>


    <div class="modal-contenido">


        <!-- CABECERA -->

        <div class="modal-header">


            <div>

                <h2>
                    🛒 Mi solicitud
                </h2>


                <p>
                    Materiales seleccionados
                </p>

            </div>


            <button
                id="cerrarCanasta"
                class="btn-cerrar"
            >

                ✕

            </button>


        </div>



        <!-- LISTA DE MATERIALES -->

        <div
            id="canasta"
            class="lista-canasta"
        >

        </div>



        <!-- =================================================
             DATOS DE LA SOLICITUD
        ================================================== -->

        <div class="datos-solicitud">


            <h3>
                📋 Datos de la solicitud
            </h3>


            <div class="campo-solicitud">

                <label for="solicitante">

                    Técnico / Ingeniero solicitante

                </label>


                <input
                    id="solicitante"
                    type="text"
                    placeholder="Ej: Jeferson Cacerez"
                >

            </div>



            <div class="campo-solicitud">

                <label for="planta">

                    Planta

                </label>


                <input
                    id="planta"
                    type="text"
                    placeholder="Ej: Clinker"
                >

            </div>



            <div class="campo-solicitud">

                <label for="zona">

                    Zona / Área

                </label>


                <input
                    id="zona"
                    type="text"
                    placeholder="Ej: Santander"
                >

            </div>


        </div>



        <!-- =================================================
             PIE DE LA VENTANA
        ================================================== -->

        <div class="modal-footer">


            <div
                id="totalCanasta"
                class="total-canasta"
            >

                0 materiales

            </div>


            <button
                id="btnCerrarAbajo"
                class="btn-secundario"
            >

                Seguir agregando

            </button>


            <button
                id="btnWhatsApp"
                class="btn-whatsapp"
            >

                📱 Enviar solicitud

            </button>


        </div>


    </div>


</div>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="script.js"></script>


</body>

</html>
